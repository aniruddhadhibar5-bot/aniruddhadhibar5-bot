<g><path d="m690 173 25-5 82 46-25 5z" fill="#070d17" stroke="#7196a9" stroke-width="2"/><path d="m704 167 20-4 80 45-21 4z" fill="#101b2c" stroke="#51ddea" stroke-width="1.5"/>
<path d="m718 152 20-4 80 45-21 4z" fill="#101b2c" stroke="#ce7cff" stroke-width="1.5"/><path d="m732 137 20-4 80 45-21 4z" fill="#101b2c" stroke="#51ddea" stroke-width="1.5"/><path d="m746 122 20-4 80 45-21 4z" fill="#101b2c" stroke="#ce7cff" stroke-width="1.5"/>
<g stroke="#d6c17d" stroke-width="2"><path d="m711 172 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7"/><path d="m725 157 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7"/><path d="m739 142 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7m4-10 5 7"/></g>
<g fill="#a9efff"><path d="m697 172 10-2 5 6-10 2z"/><path d="m801 227 10-2 5 6-10 2z"/><path d="m711 157 10-2 5 6-10 2z"/><path d="m815 212 10-2 5 6-10 2z"/></g>
<text x="761" y="253" class="micro" transform="rotate(29 761 253)">DDR / CHANNEL A+B</text></g>
<!-- Aluminum capacitors and southbridge chipset -->
<g fill="#121d2b" stroke="#9bb5c3" stroke-width="1.5"><path d="m381 260v20l16-3v-20"/><ellipse cx="389" cy="257" rx="8" ry="5" fill="url(#metal)"/><path d="m393 282v18l14-3v-18"/><ellipse cx="400" cy="279" rx="7" ry="4" fill="url(#metal)"/><path d="m657 274v20l16-3v-20"/><ellipse cx="665" cy="271" rx="8" ry="5" fill="url(#metal)"/></g>
<path d="m735 278 76-15 55 31-76 15z" fill="#08101d" stroke="#52728a" stroke-width="2"/><path d="m750 278 47-9 31 18-48 9z" fill="#172536" stroke="#5ce4ef"/><path d="m759 279 30-6 19 11-30 6z" fill="#0a1020" stroke="#8663d2"/><text x="785" y="325" text-anchor="middle" class="micro">PCH / CHIPSET</text>
<!-- Reinforced PCIe x16 slot with gold edge fingers -->
<g><path d="m343 324 326-63 25 14-326 64z" fill="#030811" stroke="#475f76" stroke-width="2"/><path d="m357 322 296-57 11 6-296 58z" fill="#141c29" stroke="#7e9bac"/><path d="m368 321 278-54 5 3-278 55z" fill="url(#gold)"/>
<path d="m385 314 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9m15-13 5 9" stroke="#342b24" stroke-width="2"/>
<path d="m677 267 18 10-12 2-17-10z" fill="#e5c779" stroke="#fff0b0"/><text x="481" y="353" class="micro">PCI EXPRESS / X16</text></g>
<!-- SATA, fan, USB, power and front-panel headers -->
<g fill="#111c2b" stroke="#8aa9b9" stroke-width="1.5"><path d="m825 337 37-7 21 12-37 8z"/><path d="m833 336 22-4 12 7-22 4z" fill="#050a13" stroke="#56d9e8"/><path d="m870 328 37-7 21 12-37 8z"/><path d="m878 327 22-4 12 7-22 4z" fill="#050a13" stroke="#56d9e8"/><path d="m263 344 36-7 20 11-36 8z"/><path d="m275 344 14-3 11 6-14 3z" fill="#070d17" stroke="#d4b366"/><path d="m584 379 46-9 25 14-46 9z"/><path d="m595 378 27-5 14 8-27 6z" fill="#080e18" stroke="#58dae9"/><path d="m925 287 45-9 26 15-46 9z" fill="#17202d" stroke="#899eaf"/></g>
<text x="834" y="374" class="micro">SATA / STORAGE</text><text x="276" y="372" class="micro">FAN / SYS</text>
<!-- Audio codecs and controller packages -->
