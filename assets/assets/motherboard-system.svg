<!-- Fine callouts identify the major subsystems -->
<g class="micro"><text x="224" y="190">01 / IO SHIELD</text><text x="348" y="178">02 / POWER STAGE</text><text x="483" y="150">03 / PROCESSOR</text><text x="774" y="130">04 / MEMORY</text><text x="877" y="250">05 / EXPANSION</text></g>
