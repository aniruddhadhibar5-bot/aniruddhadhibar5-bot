<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">AD Systems Lab — animated motherboard</title>
<desc id="desc">A detailed isometric ATX motherboard with layered PCB, copper signal traces, processor socket, DIMM memory, VRM cooling, PCIe slot, connectors and animated live diagnostics.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050814"/><stop offset=".55" stop-color="#0a1430"/><stop offset="1" stop-color="#101b3a"/></linearGradient>
<linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174c59"/><stop offset=".45" stop-color="#123849"/><stop offset="1" stop-color="#09182a"/></linearGradient>
<linearGradient id="metal" x2="1" y2="1"><stop stop-color="#e0fbff"/><stop offset=".3" stop-color="#789ab2"/><stop offset=".7" stop-color="#263d5a"/><stop offset="1" stop-color="#101729"/></linearGradient>
<linearGradient id="neon" x2="1" y2="1"><stop stop-color="#35e5f4"/><stop offset=".5" stop-color="#586fff"/><stop offset="1" stop-color="#ce50ff"/></linearGradient>
<linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0ad"/><stop offset=".5" stop-color="#c99a45"/><stop offset="1" stop-color="#654425"/></linearGradient>
<radialGradient id="chip"><stop stop-color="#273551"/><stop offset=".7" stop-color="#0b1222"/><stop offset="1" stop-color="#b782ef"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#80c9ed" stroke-opacity=".055"/></pattern>
<pattern id="pins" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#d5b56d" opacity=".8"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.label{font:11px Consolas,monospace;letter-spacing:2px;fill:#9eb8d0}.micro{font:8px Consolas,monospace;letter-spacing:1.2px;fill:#78a6be}
.trace{fill:none;stroke:#42d7de;stroke-opacity:.48;stroke-width:2}.trace2{fill:none;stroke:#bd72fa;stroke-opacity:.4;stroke-width:1.5}
.pulse{animation:pulse 1.8s ease-in-out infinite}.pulse2{animation:pulse 2.6s ease-in-out infinite .7s}.signal{stroke-dasharray:12 26;animation:signal 4s linear infinite}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes signal{to{stroke-dashoffset:-152}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.pulse,.pulse2,.signal,.float{animation:none}}
</style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect width="1200" height="760" rx="28" fill="url(#grid)"/>
<path d="M0 590 1200 350M0 690 1200 450" stroke="#4ccde8" stroke-opacity=".035"/>
<text x="58" y="62" fill="#dff8ff" font-family="monospace" font-size="17" letter-spacing="5">AD <tspan fill="#58e3f4">//</tspan> SYSTEMS LAB</text>
<text x="1142" y="62" text-anchor="end" class="micro">HARDWARE STUDY 001 / ATX PLATFORM</text>
<circle cx="1136" cy="92" r="4" fill="#55f3d0" class="pulse"/><text x="1124" y="96" text-anchor="end" class="micro">SYSTEM ONLINE</text>
<!-- Substrate, beveled FR-4 edge and copper surface -->
<path d="m155 238 535-104 365 204-536 128z" fill="#000" opacity=".58" filter="url(#shadow)"/>
<path d="m147 232 535-104 369 207-536 130z" fill="#06101d" stroke="#203c53" stroke-width="3"/>
<path d="m147 218 535-104 369 207-536 130z" fill="url(#pcb)" stroke="#43d7e8" stroke-opacity=".8" stroke-width="2.5"/>
<path d="m168 221 512-99 348 195-513 122z" fill="url(#grid)" stroke="#86eaff" stroke-opacity=".24"/>
<!-- Multilayer signal routing, branches, and flowing diagnostic signal -->
<g class="trace"><path d="m186 266 104-20 30 17 58-11 38 22 80-16 30 17 48-9"/><path d="m204 302 125-24 34 19 75-14 40 23 93-18 40 23 110-21"/><path d="m247 345 112-22 28 16 70-13 34 20 57-11"/><path d="m414 162 25 48 53 30 11 35"/><path d="m358 181 28 46-12 55 38 22"/><path d="m624 152 6 46 49 28 9 44"/><path d="m837 208-30 54-84 16-27 49"/><path d="m899 265-51 9-27 47-55 10"/><path d="m304 372 90-18 22 13 61-12"/></g>
<g class="trace2"><path d="m209 250 78-15 24 14 33-7"/><path d="m268 325 53-10 29 17 42-8"/><path d="m579 177 18 34 39 22 3 26"/><path d="m744 183 24 41-15 28 53 29"/><path d="m882 300-54 10-17 30-45 9"/><path d="m497 364 42-8 22 13 42-8"/></g>
<g class="signal" fill="none" stroke="#c2fbff" stroke-opacity=".82" stroke-width="2"><path d="m186 266 104-20 30 17 58-11 38 22 80-16"/><path d="m624 152 6 46 49 28 9 44"/></g>
<!-- Mounting points, via rings, and exposed gold contacts -->
<g fill="#10243a" stroke="#7fe9f3" stroke-width="1.5"><circle cx="177" cy="220" r="8"/><circle cx="680" cy="120" r="8"/><circle cx="1037" cy="319" r="8"/><circle cx="516" cy="437" r="8"/><circle cx="300" cy="292" r="3"/><circle cx="373" cy="344" r="3"/><circle cx="749" cy="252" r="3"/><circle cx="880" cy="294" r="3"/><circle cx="598" cy="365" r="3"/></g>
<g fill="#d8c17b"><circle cx="177" cy="220" r="3"/><circle cx="680" cy="120" r="3"/><circle cx="1037" cy="319" r="3"/><circle cx="516" cy="437" r="3"/></g>
<g fill="#c9a95e"><circle cx="251" cy="274" r="2"/><circle cx="265" cy="271" r="2"/><circle cx="279" cy="268" r="2"/><circle cx="354" cy="300" r="2"/><circle cx="367" cy="298" r="2"/><circle cx="380" cy="296" r="2"/><circle cx="741" cy="320" r="2"/><circle cx="755" cy="317" r="2"/><circle cx="769" cy="314" r="2"/><circle cx="931" cy="281" r="2"/><circle cx="945" cy="278" r="2"/></g>
<!-- Rear I/O shield and stacked connector ports -->
<g><path d="m180 222 47-9 12 7-47 10z" fill="#111c2c" stroke="#7395a9"/><path d="m187 221 16-3 7 4-16 3z" fill="#070d18" stroke="#44dff2"/><path d="m211 217 12-2 7 4-12 2z" fill="#070d18" stroke="#d58bff"/><path d="m194 233 28-5 10 6-29 6z" fill="#131c2a" stroke="#7f9caf"/><circle cx="202" cy="235" r="2" fill="#55e7ef" class="pulse"/><circle cx="213" cy="233" r="2" fill="#f0b968"/><text x="173" y="254" class="micro">REAR I/O</text></g>
<!-- VRM bank, inductors, capacitors and sculpted multi-fin heatsink -->
<g><path d="m255 246 100-20 48 27-100 20z" fill="#060b17" stroke="#253b54" stroke-width="2"/>
<g fill="url(#metal)" stroke="#b6dbea"><path d="m262 238 25-5 17 10-25 5z"/><path d="m295 231 25-5 17 10-25 5z"/><path d="m328 225 25-5 17 10-25 5z"/><path d="m275 255 20-4 14 8-20 4z"/><path d="m310 248 20-4 14 8-20 4z"/></g>
<g fill="#101927" stroke="#b4cad8"><ellipse cx="270" cy="232" rx="5" ry="3"/><ellipse cx="290" cy="245" rx="5" ry="3"/><ellipse cx="335" cy="220" rx="5" ry="3"/></g>
<g class="float"><path d="m256 218 103-20 49 27-103 21z" fill="#101a31" stroke="#6e91b1" stroke-width="2"/><path d="m266 210 88-17 43 24-89 18z" fill="url(#neon)" stroke="#bcf8ff" stroke-opacity=".8"/><path d="m276 207 8-20 7 19m6-22 7 19m7-22 7 19m7-22 7 19m7-22 7 19m7-22 7 19" fill="none" stroke="#d2f7ff" stroke-width="4" stroke-linecap="round"/></g>
<text x="260" y="285" class="micro">VRM / 12-PHASE POWER</text></g>
<!-- LGA processor socket, pin matrix, metal load plate and silicon package -->
<g><path d="m412 198 174-34 105 59-174 35z" fill="#030712" stroke="#7b56ae" stroke-width="3" filter="url(#glow)"/>
<path d="m420 194 161-31 94 53-161 32z" fill="url(#metal)" stroke="#d4f7ff" stroke-width="2"/>
<path d="m432 194 144-28 79 45-144 29z" fill="url(#pins)" stroke="#334c68" stroke-width="2"/>
<path d="m451 192 108-21 59 33-109 22z" fill="#090f1d" stroke="#8aacc3" stroke-width="3"/>
<path d="m463 190 96-18 45 26-96 19z" fill="url(#chip)" stroke="#b898f4" stroke-width="2"/>
<path d="m476 190 73-14 33 19-74 15z" fill="#151d32" stroke="#5bdff3" stroke-opacity=".9"/>
<text x="513" y="199" text-anchor="middle" fill="#e6f4ff" font-family="monospace" font-size="8" letter-spacing="1" transform="rotate(-10 513 199)">AD / CORE</text>
<path d="m430 189-8-7 11-4 8 7m151-29 11-7 9 7-11 7" fill="none" stroke="#e9c777" stroke-width="3"/><path d="m444 240 7 4m159-57 7 4" stroke="#9beef3" stroke-width="2"/>
<text x="471" y="278" class="micro">LGA SOCKET / COMPUTE</text></g>
