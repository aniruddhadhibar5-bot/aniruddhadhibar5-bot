<path d="M58 535H1142" stroke="#58d8eb" stroke-opacity=".34"/>
<text x="58" y="574" fill="#e4f6ff" font-family="monospace" font-size="17" letter-spacing="4">MOTHERBOARD / SYSTEM MAP</text>
<text x="58" y="601" class="micro">POWER DELIVERY · COMPUTE · MEMORY · EXPANSION · CONNECTIVITY</text>
<circle cx="63" cy="641" r="4" fill="#5df3d0" class="pulse"/><text x="76" y="645" class="micro">LIVE SIGNAL PATHS</text><circle cx="253" cy="641" r="4" fill="#d5a5ff"/><text x="266" y="645" class="micro">COMPONENT DIAGNOSTIC</text>
<text x="1142" y="646" text-anchor="end" fill="#70e4f2" font-family="monospace" font-size="13" letter-spacing="2">SEPARATE / INSPECT / REASSEMBLE</text>
